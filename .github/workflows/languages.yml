name: Update language chart

on:
  schedule:
    - cron: "0 3 * * *" # every day at 03:00 UTC (09:00 Bangladesh time)
  workflow_dispatch: # run by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Redraw languages.svg
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: bash .github/scripts/update-languages.sh

      - name: Commit if the chart changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md languages.svg
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update language chart"
            git push
          fi
